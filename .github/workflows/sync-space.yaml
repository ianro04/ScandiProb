name: Sync to HF Space

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for HF-full-demo changes
        id: changed
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREVIOUS_TAG" ] || ! git diff --quiet "$PREVIOUS_TAG" HEAD -- HF-full-demo; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      
      - name: Install git-subtree
        run: sudo apt-get update && sudo apt-get install -y git-subtree

      - name: Sync to HF Space
        if: steps.changed.outputs.changed == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git subtree push --prefix=HF-full-demo \
            https://ianro04:${HF_TOKEN}@huggingface.co/spaces/ianro04/ScandiProb main
